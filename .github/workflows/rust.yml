name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Bump deliberately, the same way the corpus revision is pinned: what the corpus
  # assembles to should not change because a runner image did.
  CLANG_VERSION: 21

# A newer push to the same branch makes the run in progress pointless, except on
# master, where every commit's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features

      # Almost every item in this tree carries a doc comment, and the links between
      # them are the one part of that nothing else checks. A link to something renamed
      # away is a warning, and warnings are errors here.
      # RUSTDOCFLAGS rather than the RUSTFLAGS above: that one reaches rustc and
      # this is rustdoc, and without it a broken link is a warning nothing reads.
      - name: Documentation, and the links inside it
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --document-private-items

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The corpus is a fetch plus 110 assembles, so it is worth keeping between
      # runs. Its revision and build recipe live in the Makefile and the assembler
      # that reads them is pinned above, so those two are everything that changes
      # what comes out. No restore-keys: a partial hit would leave a stale corpus
      # that the stamp file makes look built.
      - name: Cache the riscv-tests corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/rysk
          key: corpus-${{ runner.os }}-clang${{ env.CLANG_VERSION }}-${{ hashFiles('Makefile') }}

      # Ubuntu's clang trails the extensions rysk implements: it did not know the
      # tcontrol csr, and each new extension in the Makefile's -march is another way
      # for the corpus to build here and not there. Pin a version instead of finding
      # out one push at a time. Only needed when the corpus is actually being built.
      - name: Install clang ${{ env.CLANG_VERSION }}
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ env.CLANG_VERSION }}

      - name: Build the riscv-tests corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          make corpus CLANG=clang-${{ env.CLANG_VERSION }} \
            LLD=lld-${{ env.CLANG_VERSION }} \
            LLVM_OBJCOPY=llvm-objcopy-${{ env.CLANG_VERSION }}

      - run: cargo build --locked
      - run: cargo test --locked

      # The window is built by the two steps above, since it is on by default, and is
      # never run: this runner has no display. It needs no X11 or wayland package to be
      # built either, since every dependency that reaches one opens it at runtime rather
      # than linking against it.
      #
      # These two are what is not built by default, so they are only ever built here:
      # the tracing, and the headless build that leaves the window out.
      - name: Check what the default build leaves out
        run: |
          cargo check --locked --features trace
          cargo check --locked --no-default-features

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Nothing in src/ touches a Unix API and every dependency that reaches X11 or
      # wayland opens it at runtime, so this is a plain build. It is here to keep that
      # true: the day something reaches for termios or /proc, this is what says so.
      - run: cargo build --locked

      # Every suite but the corpus, which wants a RISC-V toolchain to assemble and
      # fails rather than skipping when it is missing. What is checked here is the
      # emulator, and the emulator is the part that has to be portable.
      - run: cargo test --locked --test isa --test devicetree --test softfloat --lib

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories sources
