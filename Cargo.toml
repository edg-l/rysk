[package]
name = "rysk"
version = "0.1.0"
edition = "2024"

[features]
# Compile the instruction and memory tracing in. Off by default: the spans and
# their fields cost several times what the interpretation itself does.
trace = []

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The interpreter is one hot loop calling into decode and execute. Split over the
# default sixteen codegen units those calls cross unit boundaries, and in a position
# independent binary that makes them indirect through the GOT; whole-program
# optimisation puts them back together.
[profile.release]
lto = "fat"
codegen-units = 1
