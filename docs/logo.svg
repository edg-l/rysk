<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 160" width="424" height="160" role="img" aria-labelledby="t">
  <title id="t">Rysk, a RISC-V emulator</title>

  <g stroke="#7aa2f7" stroke-width="5" stroke-linecap="round">
