<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 206" width="420" height="206" role="img" aria-labelledby="t">
  <title id="t">rysk, a RISC-V emulator</title>

  <g fill="none" stroke="#d2543c" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round">
    <!-- r -->
    <path d="M40 40 V144"/>
    <path d="M40 90 C40 52 64 38 100 44"/>
    <!-- y -->
    <path d="M122 44 L160 122"/>
    <path d="M200 44 L138 164"/>
    <!-- s -->
    <path d="M278 68 C274 47 252 40 234 48 C215 56 213 78 234 87 C255 96 272 102 270 122 C268 142 242 150 218 136"/>
    <!-- k -->
    <path d="M320 12 V144"/>
    <path d="M376 66 L324 112"/>
    <path d="M340 100 L380 144"/>
  </g>

  <!-- One 32-bit instruction word at true R-type proportions: funct7 | rs2 | rs1 |
       funct3 | rd | opcode. The opcode is the only field in colour, because it is the
       one the decoder matches on first. -->
  <g fill="#9a9aa5">
    <rect x="30" y="181" width="75.5" height="12"/>
    <rect x="108.5" y="181" width="53.9" height="12"/>
    <rect x="165.4" y="181" width="53.9" height="12"/>
    <rect x="222.3" y="181" width="32.3" height="12"/>
    <rect x="257.6" y="181" width="53.9" height="12"/>
  </g>
  <rect x="314.5" y="181" width="75.5" height="12" fill="#d2543c"/>
</svg>
