  <g fill="#3d80f5">
    <g>
      <rect x="42" y="44" width="16.6" height="12" rx="3"/>
      <rect x="60.6" y="44" width="11.4" height="12" rx="3" fill="#93b8ff"/>
      <rect x="74" y="44" width="11.4" height="12" rx="3"/>
      <rect x="87.4" y="44" width="6.2" height="12" rx="3" fill="#93b8ff"/>
      <rect x="95.6" y="44" width="11.4" height="12" rx="3"/>
      <rect x="109" y="44" width="16.6" height="12" rx="3" fill="#93b8ff"/>
    </g>
    <g>
      <rect x="42" y="74" width="30" height="12" rx="3" fill="#93b8ff"/>
      <rect x="74" y="74" width="11.4" height="12" rx="3"/>
      <rect x="87.4" y="74" width="6.2" height="12" rx="3" fill="#93b8ff"/>
      <rect x="95.6" y="74" width="11.4" height="12" rx="3"/>
      <rect x="109" y="74" width="16.6" height="12" rx="3" fill="#93b8ff"/>
    </g>
    <g>
      <rect x="42" y="104" width="16.6" height="12" rx="3" fill="#93b8ff"/>
      <rect x="60.6" y="104" width="11.4" height="12" rx="3"/>
      <rect x="74" y="104" width="11.4" height="12" rx="3" fill="#93b8ff"/>
      <rect x="87.4" y="104" width="6.2" height="12" rx="3"/>
      <rect x="95.6" y="104" width="11.4" height="12" rx="3" fill="#93b8ff"/>
      <rect x="109" y="104" width="16.6" height="12" rx="3"/>
    </g>
  </g>

  <text x="178" y="92" fill="#4c8dff"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
